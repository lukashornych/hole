services:
    agent:
        image: hole-sandbox/agent-demo-abcd1234:0123456789ab
        build:
            context: <RUN>/agent
            dockerfile: Dockerfile
            args:
                AGENT_HOME: /home/dev
                AGENT_USERNAME: dev
                CACHEBUST: "1"
                GID: "1000"
                UID: "1000"
        pull_policy: never
        command:
            - bash
        environment:
            - HOLE_GATEWAY_IP=10.222.0.53
            - HOLE_SANDBOX_NETWORK=hole-sandbox-demo-abcd1234-xyz123_sandbox
        volumes:
            - <PROJECT>:<PROJECT>
        networks:
            sandbox: {}
        dns:
            - 10.222.0.53
            - 127.0.0.11
        depends_on:
            gateway:
                condition: service_healthy
        labels:
            hole.instance: hole-sandbox-demo-abcd1234-xyz123
            hole.managed: "true"
            hole.project: demo-abcd1234
        cap_add:
            - NET_ADMIN
        stdin_open: true
        tty: true
        working_dir: <PROJECT>
    gateway:
        image: hole-sandbox/gateway:0123456789ab
        build:
            context: <RUN>/gateway
            dockerfile: Dockerfile
        pull_policy: never
        environment:
            - HOLE_SANDBOX_SUBNET=10.222.0.0/24
        volumes:
            - <RUN>/gateway-conf/Corefile:/etc/hole/Corefile:ro
            - <RUN>/gateway-conf/dnsmasq.conf:/etc/hole/dnsmasq.conf:ro
            - <RUN>/gateway-conf/nftables.rules:/etc/hole/nftables.rules:ro
        networks:
            internet: {}
            sandbox:
                ipv4_address: 10.222.0.53
        extra_hosts:
            - host.internal:host-gateway
        healthcheck:
            test:
                - CMD-SHELL
                - dig +short +time=1 +tries=1 @127.0.0.1 health.hole.internal A | grep -qx 127.0.0.1
            interval: 2s
            timeout: 2s
            retries: 10
        labels:
            hole.instance: hole-sandbox-demo-abcd1234-xyz123
            hole.managed: "true"
            hole.project: demo-abcd1234
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "1"
        restart: on-failure
networks:
    internet:
        external: true
        name: hole-sandbox-demo-abcd1234-xyz123_internet
    sandbox:
        external: true
        name: hole-sandbox-demo-abcd1234-xyz123_sandbox
