# Enforcement back-end: resolves names CoreDNS already approved and records every answered
# address in the matching nftables set.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
no-poll
server=127.0.0.11
nftset=/github.com/4#inet#hole#g0
nftset=/api.github.com/4#inet#hole#g2
nftset=/npmjs.org/4#inet#hole#g2
nftset=/db.example.com/4#inet#hole#g3
