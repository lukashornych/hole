name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.ref_name }}   # for the same branch
  cancel-in-progress: true        # run only one workflow at a time (cancel the previous)

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Conventional commits drive the version: a `!` marker or a `BREAKING CHANGE:` footer bumps
      # the major, `feat:` the minor, everything else the patch.
      - name: Resolve version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: 'main'
          prefix: 'v'
          # Single backslashes: YAML single quotes do not process escapes, so a doubled one
          # reaches the regex as a literal backslash and stops `feat(scope):` from matching.
          minor-identifier: '/feat(\([^)]+\))?:/'
          # Lowercase only — the action downcases each line before matching, so an uppercase
          # `BREAKING CHANGE` here could never fire. It also prepends `^` to this pattern and
          # matches per line, which is why a footer on its own line counts. Types are listed rather
          # than matched with \w+ so the marker cannot come from prose.
          major-identifier: '/((feat|fix|refactor|perf|build|chore|docs|style|test|ci)(\([^)]+\))?!:|breaking[ -]change:)/'

      # GoReleaser builds from a tag, so the resolved version becomes one — pushed before the
      # release notes so the repository keeps the annotated tag rather than the lightweight one
      # release-drafter would create as a side effect.
      - name: Tag the resolved version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Draft the release notes
        id: release
        uses: release-drafter/release-drafter@v5
        with:
          version: ${{ steps.version.outputs.version }}
          publish: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # GORELEASER_CURRENT_TAG makes the resolved version explicit instead of relying on
      # GoReleaser inferring it back out of the tag it finds at HEAD.
      - name: Build and upload the binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
